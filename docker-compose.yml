version: "3.9"

services:
  backend:
    build: ./backend
    container_name: maduraapp_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/weights:/app/weights
    env_file:
      - ./backend/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    container_name: maduraapp_db
    environment:
      POSTGRES_USER: maduraapp
      POSTGRES_PASSWORD: maduraapp_dev
      POSTGRES_DB: maduraapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: